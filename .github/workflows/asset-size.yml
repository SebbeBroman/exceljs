name: Asset size

on: [pull_request]

jobs:
  compare:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Browser smoke bundle via esbuild (no Grunt/Babel)
      - run: pnpm run test:browser-bundle
      # Fails the PR when the browser bundle grows past its budgets.
      #
      # This replaced chrysanthos/simple-asset-size-reporter@1.0.2. That action
      # is unmaintained (last code change April 2020) and loads the `esm` shim,
      # which patches CommonJS module loading and crashes on the Node 24 that
      # GitHub forces Actions onto. It failed on every run in this repo's
      # history, including on master, so it was never actually gating anything.
      # Budgets live in scripts/check-asset-size.mjs.
      - run: pnpm run check:asset-size
